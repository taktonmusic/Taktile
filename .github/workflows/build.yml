name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taktile
    steps:
      - uses: actions/checkout@v4

      - name: Install cross compiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu

      - name: Check UI syntax
        run: node --check ui.js

      - name: UI smoke + fuzz test (mocked host)
        run: node tools/test/test_smoke.js

      - name: Browser behaviour test
        run: node tools/test/test_browser.js

      - name: MIC page test
        run: node tools/test/test_mic.js

      - name: New clip sound test
        run: node tools/test/test_clipsound.js

      - name: Song page test
        run: node tools/test/test_song.js

      - name: Hiss migration test
        run: node tools/test/test_hiss.js

      - name: Preset list test
        run: node tools/test/test_presets.js

      - name: Native tests (MIC recording, Duck, Tape)
        run: |
          ./scripts/fetch-header.sh
          for t in mic duck tape preset newsynth; do
            gcc -O2 -Wno-misleading-indentation -Ibuild/include -o /tmp/${t}_test tools/test/${t}_test.c src/pad_studio.c -lm
            /tmp/${t}_test
          done

      - name: Native build with sanitizers (compile check)
        run: |
          ./scripts/fetch-header.sh
          gcc -shared -fPIC -g -fsanitize=address,undefined -Wall -Wextra -Wno-misleading-indentation \
              -Ibuild/include src/pad_studio.c -o /tmp/dsp_native.so -lm

      - name: Build module for Move (aarch64)
        run: ./scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: taktile-module
          path: taktile/dist/taktile-module.tar.gz

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: taktile-module

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv_ver=$(grep -m1 '"version"' taktile/module.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          # newest CHANGELOG entry (from the first "## " line up to the next one)
          awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2 > latest_changes.md
          {
            echo "## Taktile - groovebox for the Ableton Move"
            echo
            echo "16 tracks of synths and drums, step sequencer, 1462 sounds, effects, sampler with microphone recording and live performance tools. A Schwung overtake module. **Current version: ${mv_ver}**"
            echo
            echo "### What is new in ${mv_ver}"
            cat latest_changes.md
            echo
            echo "### Install"
            echo "1. Download **taktile-module.tar.gz** below. Do not unpack it."
            echo "2. Put the Move and your computer or phone in the same Wi-Fi and open http://move.local:7700"
            echo "3. Upload the file as a custom module and restart Schwung if Taktile does not show up."
            echo
            echo "### Docs"
            echo "English and German manuals are in taktile/docs. All changes are in CHANGELOG.md. Please report problems as an issue and name your firmware and Schwung version."
            echo
            echo "### Thanks"
            echo "Big thanks to Neuro... No Neuro (https://www.neurononeuro.net) for testing and honest feedback."
          } > notes_full.md
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            TITLE="Taktile ${GITHUB_REF_NAME}"
          else
            # one rolling release: always the newest version, never a new release per update
            TAG="latest"
            TITLE="Taktile 1.0.0"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git tag -f latest "${GITHUB_SHA}"
            git push -f origin refs/tags/latest
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" taktile-module.tar.gz --clobber
            gh release edit "${TAG}" --title "${TITLE}" --notes-file notes_full.md --latest
          else
            gh release create "${TAG}" taktile-module.tar.gz --title "${TITLE}" --notes-file notes_full.md --latest
          fi
