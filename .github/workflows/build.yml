name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taktile
    steps:
      - uses: actions/checkout@v4

      - name: Install cross compiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu

      - name: Check UI syntax
        run: node --check ui.js

      - name: UI behaviour tests (mocked host, fuzzing)
        run: |
          node tools/test/test_jog.js
          node tools/test/test_resample.js

      - name: DSP tests (sample import, resample limit; sanitizers)
        run: ./tools/test/run_dsp_test.sh

      - name: Native build with sanitizers (compile check)
        run: |
          ./scripts/fetch-header.sh
          gcc -shared -fPIC -g -fsanitize=address,undefined -Wall -Wextra -Wno-misleading-indentation \
              -Ibuild/include src/pad_studio.c -o /tmp/dsp_native.so -lm

      - name: Build module for Move (aarch64)
        run: ./scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: taktile-module
          path: taktile/dist/taktile-module.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match module.json version
        run: |
          v=$(grep -m1 '"version"' taktile/module.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match module.json version v$v"; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          name: taktile-module

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" taktile-module.tar.gz \
            --title "Taktile ${GITHUB_REF_NAME}" \
            --notes "See CHANGELOG.md. Unpack and copy the taktile/ folder to /data/UserData/schwung/modules/overtake/ on your Move, then restart Schwung. Full steps: README."
