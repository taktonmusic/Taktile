<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taktile – Animated Guide</title>
<style>
:root{--bg:#f6f8fc;--ink:#1d2330;--mut:#5b657a;--acc:#2d7bff;--acc2:#6a4bff}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}
.hero{position:relative;color:#fff;background:#070d1c;overflow:hidden;padding:28px 0 56px}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(700px 420px at 80% 20%,rgba(60,120,255,.6),transparent 60%),radial-gradient(600px 460px at 5% 90%,rgba(150,70,255,.5),transparent 60%)}
.hero:after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:40px 40px;animation:grid 14s linear infinite}
@keyframes grid{to{background-position:40px 40px}}
.hero .wrap{position:relative;z-index:1}
.lang{position:absolute;right:0;top:0;display:flex;gap:6px}.lang button{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.08);color:#fff;border-radius:99px;padding:5px 14px;font-weight:700;cursor:pointer}.lang button.on{background:#fff;color:#0b1430}
.tag{letter-spacing:4px;font-size:12px;color:#8fb6ff;margin-top:42px}
h1{font-size:clamp(46px,9vw,88px);margin:6px 0 4px;line-height:1;letter-spacing:-2px;background:linear-gradient(90deg,#fff,#9cc2ff);-webkit-background-clip:text;color:transparent}
.sub{font-size:clamp(16px,2.4vw,22px);color:#cbd8f7;max-width:560px}
.dev{margin-top:26px;max-width:560px;border:2px solid #3b4b7a;border-radius:12px;box-shadow:0 0 70px rgba(70,130,255,.6),0 24px 40px rgba(0,0,0,.6);position:relative;aspect-ratio:2/1;background:#16181e;overflow:hidden}
.dev img{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;opacity:0;transition:opacity .5s}.dev img.on{opacity:1}
section{padding:34px 0}h2{font-size:clamp(22px,4vw,32px);margin:0 0 6px}.s{color:var(--mut);margin:0 0 16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{border-radius:14px;color:#fff;padding:16px 18px;transform:translateY(14px);opacity:0;transition:.6s}.card.in{transform:none;opacity:1}.card:hover{transform:translateY(-4px) scale(1.02)}
.card b{font-size:19px;display:block;margin-bottom:4px}.card span{opacity:.95;font-size:15px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tabs button{border:2px solid #cfd8ec;background:#fff;border-radius:99px;padding:8px 16px;font-weight:700;color:#33405c;cursor:pointer;font-size:15px}.tabs button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:#fff}
.player{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}@media(max-width:760px){.player{grid-template-columns:1fr}}
.scr{border:3px solid #2b2f3a;border-radius:10px;background:#16181e;aspect-ratio:2/1;position:relative;overflow:hidden;box-shadow:0 6px 18px rgba(20,30,60,.3)}.scr img{width:100%;height:100%;display:block;image-rendering:pixelated;animation:pop .35s}
@keyframes pop{from{opacity:.2;transform:scale(1.03)}to{opacity:1;transform:none}}
.cap{background:#fff;border-radius:10px;padding:12px 14px;margin-top:10px;font-size:17px;min-height:64px;border-left:5px solid var(--acc)}
.bar{height:6px;background:#dfe6f5;border-radius:9px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.ctrls{display:flex;gap:8px;margin-top:10px}.ctrls button{border:1px solid #cfd8ec;background:#fff;border-radius:8px;padding:7px 14px;font-weight:700;cursor:pointer}
svg.ctrl{width:100%;background:#fff;border:1px solid #dfe6f5;border-radius:12px}svg.ctrl .b{fill:#eef1f7;stroke:#aab3c6;stroke-width:1.4}svg.ctrl text{font:700 9px system-ui;fill:#5b657a;text-anchor:middle;pointer-events:none}
svg.ctrl .hi{fill:#ffcf3d;stroke:#e08a00;stroke-width:2.4;animation:pulse .9s infinite}svg.ctrl .hi.turn{animation:pulse .9s infinite}
@keyframes pulse{50%{opacity:.55;transform-box:fill-box;transform-origin:center;transform:scale(1.14)}}
.shift{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}@media(max-width:560px){.shift{grid-template-columns:repeat(4,1fr)}}
.sb{background:#fff;border:2px solid #cfd8ec;border-radius:10px;padding:10px 4px;text-align:center;cursor:pointer;font-size:12px;font-weight:700;color:#33405c;transition:.2s}.sb b{display:block;font-size:20px;color:var(--acc)}.sb.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent;transform:scale(1.07)}.sb.on b{color:#fff}
.seq{background:#0f1424;border-radius:14px;padding:16px;color:#fff}.row{display:flex;align-items:center;gap:6px;margin:6px 0}.row em{width:62px;font-style:normal;font-size:12px;color:#9fb0d6}.cells{display:grid;grid-template-columns:repeat(16,1fr);gap:4px;flex:1}.cells i{aspect-ratio:1;border-radius:4px;background:#222c48;transition:.25s}.cells i.on{background:#5aa0ff;box-shadow:0 0 10px #5aa0ff}.cells i.ph{outline:2px solid #ffcf3d;outline-offset:1px}
.cheat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.cheat div{background:#fff;border:2px solid #cfd8ec;border-radius:10px;padding:10px;text-align:center}.cheat b{display:block;color:var(--acc)}
footer{padding:24px 0 40px;color:var(--mut);font-size:13px;text-align:center}
.logo{margin:6px 0 4px}.logo svg{height:clamp(56px,11vw,96px);width:auto}</style></head><body>
